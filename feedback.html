<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrideHouse — Feedback</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="forms.css">
<link rel="icon" href="favicon.png" type="image/x-icon">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">StrideHouse</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link active fw-bold" href="feedback.html">Feedback</a></li>
        <li class="nav-item"><a class="nav-link" href="support.html">Support</a></li>
        <li class="nav-item"><a class="nav-link" href="returns.html">Returns</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li>
        <li class="nav-item ms-lg-2"><a class="btn btn-success btn-sm" href="register.html">Sign up</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4 narrow">
  <h1>Leave Feedback</h1>
  <p class="intro">Bought a pair from us? Tell us what you think. All fields are required.</p>

  <div class="form-box">
    <form action="#" method="post" class="plain-form">
      <p>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required minlength="2" maxlength="30">
      </p>
      <p>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="message">Your feedback:</label><br>
        <textarea id="message" name="message" rows="4" required minlength="10" maxlength="200"></textarea>
      </p>
      <button type="submit">Send feedback</button>
    </form>
  </div>
</main>

<footer class="forms-footer">
  © 2026 StrideHouse. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
